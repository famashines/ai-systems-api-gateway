name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          build-args: RELEASE=${{ github.sha }}

      - name: Make the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          image: ${{ env.IMAGE }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json
          upload-release-assets: false

      - name: Scan the image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439
        with:
          image: ${{ env.IMAGE }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        id: push
        run: |
          docker push "$IMAGE"
          digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${IMAGE}@${digest}" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: famashines/gitops
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Open a gitops pull request with the new image
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          SHA: ${{ github.sha }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          tag="sha-${SHA}"
          short="${SHA::7}"
          branch="release/ai-systems-api-gateway-prod-${short}"
          sed -i -e "s|newTag: .*|newTag: ${tag}|" -e "s|digest: .*|digest: ${DIGEST}|" "kubernetes/ai-systems/ai-systems-api-gateway/prod/kustomization.yaml"
          if git diff --quiet; then
            echo "prod already uses ${tag}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore(ai-systems-api-gateway): release sha-${short} to prod"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(ai-systems-api-gateway): release sha-${short} to prod" \
            --body "Deploy \`ghcr.io/${GITHUB_REPOSITORY}:${tag}@${DIGEST}\` to prod, from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${SHA}. The owner merges this pull request."
